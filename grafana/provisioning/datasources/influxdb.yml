apiVersion: 1
datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: my-iot-org
      defaultBucket: iot-data
      tlsSkipVerify: true
    secureJsonData:
      token: iot-demo-token
    isDefault: true
