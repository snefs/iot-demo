services:
  # 1. MQTT Broker (Eclipse Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iot-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - iot-network

  # 2. Node-RED (Automation Engine)
  nodered:
    build:
      context: ./node-red
      dockerfile: Dockerfile
    image: iot-nodered:latest
    container_name: iot-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      # Persist the complete Node-RED user directory on the host, including
      # flows, credentials, settings, and installed nodes.
      - ./node-red:/data
    environment:
      - TZ=UTC
    depends_on:
      - mosquitto
    networks:
      - iot-network

  # 3. InfluxDB (Time-Series Database v2)
  influxdb:
    image: influxdb:2.7
    container_name: iot-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
      - ./influxdb/config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=ChangeThisSecurePassword123!
      - DOCKER_INFLUXDB_INIT_ORG=my-iot-org
      - DOCKER_INFLUXDB_INIT_BUCKET=iot-data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=iot-demo-token
    networks:
      - iot-network

  # 4. Grafana (Data Visualization Dashboard)
  grafana:
    image: grafana/grafana-oss:latest
    container_name: iot-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/iot-machine-monitoring.json:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=ChangeThisSecurePassword123!
    depends_on:
      - influxdb
    networks:
      - iot-network

  # 5. Python Application Environment
  python-app:
    image: python:3.11-slim
    container_name: iot-python-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./python:/app
    working_dir: /app
    environment:
      - INFLUX_TOKEN=iot-demo-token
      - INFLUX_ORG=my-iot-org
      - INFLUX_BUCKET=iot-data
      - ORDER_API_URL=http://nodered:1880/orderapi
    # Keeps the container running so you can execute scripts or run a listener script
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn order_calculator:app --host 0.0.0.0 --port 8000"
    depends_on:
      - mosquitto
      - influxdb
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge
